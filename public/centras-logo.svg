<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130" fill="none" aria-label="Centras Insurance">
  <defs>
    <linearGradient id="centras-grad" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E8001E"/>
      <stop offset="35%"  stop-color="#C2155A"/>
      <stop offset="65%"  stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#2A3FDB"/>
    </linearGradient>
    <linearGradient id="ins-grad" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#E8001E"/>
      <stop offset="100%" stop-color="#C2155A"/>
    </linearGradient>
  </defs>

  <!-- "centras" wordmark — rounded sans letterforms -->
  <text
    x="0" y="88"
    font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
    font-weight="700"
    font-size="92"
    letter-spacing="-2"
    fill="url(#centras-grad)"
  >centras</text>

  <!-- "insurance" sub-label -->
  <text
    x="4" y="120"
    font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif"
    font-weight="400"
    font-size="26"
    letter-spacing="1"
    fill="url(#ins-grad)"
  >insurance</text>
</svg>
