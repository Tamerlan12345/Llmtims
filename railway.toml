[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --loop asyncio --timeout-keep-alive 120"
healthcheckPath = "/status"
healthcheckTimeout = 300    # model load takes ~30-60s
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "gemma-chat"
